[project]
name = "twpay-checkout"
version = "0.2.0"
description = "ECPay sandbox payment-lifecycle lab with recurring billing, recovery, refund policy, reconciliation, and auditable operations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
    "sqlmodel>=0.0.24,<0.1",
    "jinja2>=3.1,<4",
    "pydantic-settings>=2.10,<3",
    "cryptography>=45,<47",
    "python-multipart>=0.0.20,<0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "httpx2>=2.9,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twpay_checkout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
