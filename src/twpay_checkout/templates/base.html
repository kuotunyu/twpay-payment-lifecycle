<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}twpay-checkout{% endblock %}</title>
  <style>
    :root {
      --ink: #10201a;
      --muted: #66736d;
      --line: #cfd5ce;
      --paper: #f4f1e8;
      --card: #fffdf7;
      --night: #0b1a15;
      --accent: #177052;
      --signal: #f16b32;
      --pending: #bd6508;
      --paid: #147a4d;
      --failed: #b83b32;
      --expired: #68716d;
      --waiting: #146b8c;
      --shadow: 7px 7px 0 rgba(11, 26, 21, .13);
    }
    * { box-sizing: border-box; }
    html { background: var(--night); }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(rgba(16, 32, 26, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 32, 26, .035) 1px, transparent 1px),
        var(--paper);
      background-size: 24px 24px;
      color: var(--ink);
      font-family: "IBM Plex Sans", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.6;
    }
    a { color: var(--accent); text-underline-offset: 3px; }
    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      color: #f9f5e9;
      background: rgba(11, 26, 21, .96);
      border-bottom: 3px solid var(--signal);
      backdrop-filter: blur(14px);
    }
    .site-header .wrap {
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .site-header a { color: inherit; text-decoration: none; }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: .7rem;
      font-family: "Noto Serif TC", "PMingLiU", serif;
      font-weight: 800;
      font-size: 1.08rem;
      letter-spacing: -.02em;
    }
    .brand-mark {
      display: grid;
      width: 35px;
      height: 35px;
      place-items: center;
      color: var(--night);
      background: #d9f072;
      border-radius: 50% 50% 48% 46%;
      font-family: Consolas, monospace;
      font-size: .8rem;
      transform: rotate(-4deg);
    }
    .site-header .sub {
      color: #a9b8b0;
      font-size: .76rem;
      letter-spacing: .08em;
    }
    .site-header nav { margin-left: auto; }
    .site-header nav a {
      display: inline-block;
      padding: .45rem .8rem;
      border: 1px solid #53635b;
      border-radius: 999px;
      color: #dce7e1;
      font-size: .82rem;
      transition: .2s ease;
    }
    .site-header nav { display: flex; gap: .5rem; }
    .site-header nav a:hover { border-color: #d9f072; color: #d9f072; }
    .wrap { width: min(1120px, calc(100% - 2rem)); margin: 0 auto; }
    main.wrap { padding-top: 3rem; padding-bottom: 4rem; }
    h1, h2, h3 {
      font-family: "Noto Serif TC", "PMingLiU", serif;
      line-height: 1.2;
      letter-spacing: -.025em;
    }
    h1 { font-size: clamp(2rem, 5vw, 3.8rem); margin: 0; }
    h2 { font-size: clamp(1.35rem, 3vw, 2rem); }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: .55rem;
      margin: 0 0 .8rem;
      color: var(--accent);
      font: 700 .72rem/1.2 Consolas, monospace;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 28px; height: 2px; background: var(--signal); }
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(270px, .6fr);
      gap: clamp(2rem, 7vw, 6rem);
      align-items: end;
      margin-bottom: 3.2rem;
    }
    .hero-copy { max-width: 680px; margin: 1rem 0 0; color: var(--muted); font-size: 1.02rem; }
    .proof-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      border-top: 1px solid var(--ink);
      border-left: 1px solid var(--ink);
      background: var(--card);
      box-shadow: var(--shadow);
    }
    .proof-grid div { padding: 1rem; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
    .proof-grid strong { display: block; color: var(--signal); font: 800 1.5rem/1 Consolas, monospace; }
    .proof-grid span { display: block; margin-top: .3rem; color: var(--muted); font-size: .72rem; }
    .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; }
    .section-heading h2 { margin: 0; }
    .section-heading p { margin: 0; color: var(--muted); font-size: .86rem; }
    .card {
      margin-bottom: 1.2rem;
      padding: clamp(1.1rem, 2vw, 1.55rem);
      background: var(--card);
      border: 1px solid var(--ink);
      border-radius: 2px;
      box-shadow: var(--shadow);
    }
    .product-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.25rem; }
    .product-card { position: relative; overflow: hidden; transition: transform .2s ease, box-shadow .2s ease; }
    .product-card::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 72px;
      height: 8px;
      background: var(--product-color, var(--accent));
    }
    .product-card:hover { transform: translate(-2px, -2px); box-shadow: 10px 10px 0 rgba(11, 26, 21, .16); }
    .product-card:nth-child(1) { --product-color: #f16b32; }
    .product-card:nth-child(2) { --product-color: #147a4d; }
    .product-card:nth-child(3) { --product-color: #146b8c; }
    .product-index { color: var(--muted); font: 700 .72rem/1 Consolas, monospace; letter-spacing: .1em; }
    .product-name { min-height: 3.2rem; margin: .75rem 0 .25rem; font-family: "Noto Serif TC", serif; font-size: 1.22rem; font-weight: 800; }
    .price { margin: .75rem 0; font: 800 1.45rem/1.2 Consolas, monospace; letter-spacing: -.04em; }
    .muted { color: var(--muted); font-size: .86rem; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      padding: .25rem .65rem;
      border-radius: 999px;
      color: #fff;
      font: 700 .7rem/1.4 Consolas, monospace;
      letter-spacing: .04em;
      text-transform: uppercase;
      vertical-align: middle;
    }
    .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .badge.pending { background: var(--pending); }
    .badge.awaiting_payment { background: var(--waiting); }
    .badge.paid { background: var(--paid); }
    .badge.failed { background: var(--failed); }
    .badge.expired { background: var(--expired); }
    .badge.active, .badge.completed { background: var(--paid); }
    .badge.past_due { background: var(--failed); }
    .badge.canceled { background: var(--expired); }
    .ok { color: var(--paid); font-weight: 600; }
    .ng { color: var(--failed); font-weight: 600; }
    .table-shell { overflow-x: auto; border: 1px solid var(--ink); background: var(--card); box-shadow: var(--shadow); }
    table { width: 100%; border-collapse: collapse; font-size: .83rem; }
    th, td { padding: .75rem .8rem; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
    th {
      color: #dce7e1;
      background: var(--night);
      font: 700 .69rem/1.4 Consolas, monospace;
      letter-spacing: .05em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #f1eee3; }
    form.buy { margin-top: 1.15rem; border-top: 1px solid var(--line); padding-top: 1rem; }
    .field-grid { display: grid; gap: .7rem; }
    form.buy label { display: grid; gap: .3rem; color: var(--muted); font-size: .72rem; font-weight: 700; letter-spacing: .04em; }
    select, input {
      width: 100%;
      min-height: 42px;
      padding: .45rem .65rem;
      color: var(--ink);
      background: #fffdf8;
      border: 1px solid #aeb8b1;
      border-radius: 0;
      font: inherit;
    }
    input[type="file"] { padding: .55rem; }
    button, .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .75rem;
      min-height: 44px;
      padding: .6rem 1.05rem;
      color: #fff;
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 0;
      font: 700 .82rem/1.2 inherit;
      cursor: pointer;
      text-decoration: none;
      transition: .18s ease;
    }
    form.buy button { width: 100%; margin-top: .85rem; background: var(--night); border-color: var(--night); }
    button:hover, .btn:hover { color: var(--night); background: #d9f072; border-color: var(--night); transform: translateY(-1px); }
    button:focus-visible, .btn:focus-visible, a:focus-visible, select:focus-visible {
      outline: 3px solid #f7b28f;
      outline-offset: 3px;
    }
    code {
      padding: .12rem .38rem;
      background: #e6e9e3;
      border-radius: 2px;
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: .84em;
    }
    .kv { display: grid; grid-template-columns: minmax(130px, .36fr) 1fr; gap: 0; margin: 0; }
    .kv dt, .kv dd { margin: 0; padding: .72rem 0; border-bottom: 1px solid var(--line); }
    .kv dt { color: var(--muted); font-size: .76rem; font-weight: 700; letter-spacing: .03em; }
    .kv dd { font-size: .92rem; }
    .atm-box {
      position: relative;
      margin-top: 1.2rem;
      padding: 1.2rem;
      background: #e8f3e9;
      border: 1px dashed var(--accent);
    }
    .atm-box::before, .atm-box::after {
      content: "";
      position: absolute;
      left: -8px;
      width: 15px;
      height: 15px;
      background: var(--card);
      border: 1px solid var(--accent);
      border-radius: 50%;
    }
    .atm-box::before { top: 22%; }
    .atm-box::after { bottom: 22%; }
    .page-heading { margin-bottom: 1.6rem; }
    .page-heading h1 { font-size: clamp(1.8rem, 4vw, 3rem); }
    .page-heading .muted { max-width: 700px; margin-top: .7rem; }
    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .order-header h1 { font-size: clamp(1.55rem, 4vw, 2.6rem); }
    .order-number { display: block; margin-top: .45rem; color: var(--muted); font: 700 .8rem/1.2 Consolas, monospace; }
    .status-rail { display: grid; grid-template-columns: repeat(3, 1fr); margin: 0 0 1.5rem; border: 1px solid var(--ink); }
    .status-step { position: relative; padding: .8rem 1rem; border-right: 1px solid var(--ink); background: #e9e6dc; }
    .status-step:last-child { border-right: 0; }
    .status-step span { display: block; color: var(--muted); font: 700 .65rem/1.2 Consolas, monospace; letter-spacing: .08em; }
    .status-step strong { font-size: .82rem; }
    .status-step.done { background: #dcebdd; }
    .status-step.active { color: #fff; background: var(--night); }
    .status-step.active span { color: #d9f072; }
    details summary { cursor: pointer; }
    .ops-hero {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(340px, .85fr);
      gap: clamp(2rem, 6vw, 5rem);
      align-items: end;
      margin-bottom: 1.5rem;
    }
    .ops-metrics {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      border: 1px solid var(--ink);
      box-shadow: var(--shadow);
    }
    .ops-metrics div { padding: 1rem; background: var(--card); border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
    .ops-metrics div:nth-child(even) { border-right: 0; }
    .ops-metrics div:nth-child(n+3) { border-bottom: 0; }
    .ops-metrics strong { display: block; font: 800 1.6rem/1 Consolas, monospace; color: var(--signal); }
    .ops-metrics span { display: block; margin-top: .35rem; color: var(--muted); font-size: .72rem; }
    .truth-strip {
      display: flex;
      flex-wrap: wrap;
      gap: .8rem 1.4rem;
      padding: .85rem 1rem;
      color: #dce7e1;
      background: var(--night);
      border-left: 6px solid var(--signal);
      font-size: .72rem;
      letter-spacing: .02em;
    }
    .truth-strip span { display: inline-flex; align-items: center; gap: .4rem; }
    .truth-strip i { width: 8px; height: 8px; border-radius: 50%; }
    .truth-live { background: #8bdd69; }
    .truth-sim { background: #ff8b5b; }
    .truth-import { background: #71b9db; }
    .ops-section { margin-top: 4rem; scroll-margin-top: 90px; }
    .btn-small { min-height: 34px; padding: .4rem .65rem; font-size: .72rem; }
    .audit-fold, .reconcile-run { margin-top: 1rem; border: 1px solid var(--ink); background: var(--card); }
    .audit-fold > summary, .reconcile-run > summary {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: .8rem 1rem;
      color: #dce7e1;
      background: var(--night);
      font-size: .78rem;
    }
    .audit-fold .table-shell, .reconcile-run .table-shell { border: 0; box-shadow: none; }
    .notice-warning { margin-bottom: 1rem; padding: 1rem; color: #6b3518; background: #ffead7; border: 1px solid #c46632; }
    .notice-warning strong { margin-right: .4rem; }
    .refund-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
    .ops-form { display: grid; gap: .7rem; }
    .ops-form h3, .ops-form p { margin: 0; }
    .ops-form label, .reconcile-form label { display: grid; gap: .3rem; color: var(--muted); font-size: .74rem; font-weight: 700; }
    .reconcile-form { display: grid; grid-template-columns: .7fr .7fr 1.5fr auto; align-items: end; gap: .8rem; }
    .reconcile-run > p { padding: 0 1rem; }
    .site-footer {
      padding: 1.4rem 0;
      color: #a9b8b0;
      background: var(--night);
      border-top: 1px solid #35443d;
      font-size: .72rem;
      letter-spacing: .04em;
    }
    .site-footer .wrap { display: flex; justify-content: space-between; gap: 1rem; }
    @media (max-width: 820px) {
      .hero { grid-template-columns: 1fr; gap: 1.5rem; }
      .ops-hero { grid-template-columns: 1fr; gap: 1.5rem; }
      .product-grid { grid-template-columns: 1fr; }
      .refund-grid { grid-template-columns: 1fr; }
      .reconcile-form { grid-template-columns: 1fr 1fr; }
      .product-name { min-height: auto; }
    }
    @media (max-width: 600px) {
      .wrap { width: min(100% - 1.2rem, 1120px); }
      main.wrap { padding-top: 2rem; }
      .site-header .sub { display: none; }
      .site-header nav a { padding: .38rem .58rem; font-size: .72rem; }
      .site-header .wrap { min-height: 62px; }
      .hero { margin-bottom: 2.3rem; }
      .section-heading { align-items: start; flex-direction: column; }
      .kv { grid-template-columns: 1fr; }
      .kv dt { padding-bottom: 0; border-bottom: 0; }
      .kv dd { padding-top: .15rem; }
      .order-header { align-items: start; flex-direction: column; }
      .status-step { padding: .7rem .55rem; }
      .site-footer .wrap { flex-direction: column; }
      .reconcile-form { grid-template-columns: 1fr; }
      .audit-fold > summary, .reconcile-run > summary { flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/"><span class="brand-mark">T$</span><span>twpay-checkout</span></a>
    <span class="sub">ECPAY · PAYMENT OPERATIONS LAB</span>
    <nav><a href="/admin/operations">付款營運台</a><a href="/admin/notifications">通知稽核</a></nav>
  </div>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer class="site-footer">
  <div class="wrap">
    <span>PAYMENT LIFECYCLE LAB · TEST ENVIRONMENTS ONLY</span>
    <span>FastAPI / SQLModel / Audit-first operations</span>
  </div>
</footer>
</body>
</html>
